<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scarlett Full Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #fff; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .toggle-bg { background: #1f2937; }
        .toggle-checkbox:checked + .toggle-bg { background: #dc2626; box-shadow: 0 0 15px rgba(220, 38, 38, 0.5); }
        .neon-text { text-shadow: 0 0 10px rgba(220, 38, 38, 0.5); }
        .neon-border:focus { border-color: #dc2626; box-shadow: 0 0 10px rgba(220, 38, 38, 0.3); outline: none; }
        input[type="range"] { -webkit-appearance: none; height: 4px; background: #374151; border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #dc2626; cursor: pointer; box-shadow: 0 0 10px rgba(220, 38, 38, 0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">
    
    <!-- Ambient Background -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-red-900/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-10 pointer-events-none mix-blend-overlay"></div>

    <div class="z-10 w-full max-w-3xl">
        <!-- Header -->
        <div class="flex items-center justify-between mb-10 pb-4 border-b border-red-500/20">
            <div>
                <h1 class="text-3xl font-extrabold tracking-[0.2em] text-red-400 neon-text">SCARLETT</h1>
                <p class="text-xs text-gray-500 mono mt-1">SYSTEM CONTROL PANEL V2.0</p>
            </div>
            <button id="saveBtn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-6 rounded-lg transition-all shadow-[0_0_20px_rgba(220,38,38,0.4)]">Save Changes</button>
        </div>

        <!-- General Settings Card -->
        <div class="glass rounded-2xl p-6 mb-6 shadow-xl">
            <h2 class="text-sm font-bold text-gray-400 tracking-widest mb-4 uppercase">General Configuration</h2>
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="font-semibold text-white">Face Authentication</h3>
                        <p class="text-xs text-gray-500">Require face scan to unlock Scarlett.</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="face_auth" class="sr-only toggle-checkbox">
                        <div class="w-12 h-6 toggle-bg rounded-full transition-all"></div>
                        <span class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform toggle-dot"></span>
                    </label>
                </div>
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="font-semibold text-white">Mirror Camera (Horizontal Flip)</h3>
                        <p class="text-xs text-gray-500">Inverts the camera feed for hand tracking.</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="camera_flipped" class="sr-only toggle-checkbox">
                        <div class="w-12 h-6 toggle-bg rounded-full transition-all"></div>
                        <span class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform toggle-dot"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Tool Permissions Card -->
        <div class="glass rounded-2xl p-6 mb-6 shadow-xl">
            <h2 class="text-sm font-bold text-gray-400 tracking-widest mb-4 uppercase">AI Tool Permissions</h2>
            <div id="permissions_grid" class="grid grid-cols-2 gap-4">
                <!-- JS will populate this -->
            </div>
        </div>

        <!-- Status Message -->
        <div id="status_msg" class="hidden text-center text-green-400 mono text-sm mt-4 animate-pulse"></div>
    </div>

    <script>
        // Simple JS to handle toggle dots
        document.querySelectorAll('.toggle-checkbox').forEach(cb => {
            cb.addEventListener('change', () => {
                const dot = cb.parentElement.querySelector('.toggle-dot');
                if(cb.checked) dot.style.transform = 'translateX(24px)';
                else dot.style.transform = 'translateX(0)';
            });
        });

        // Fetch current settings
        async function loadSettings() {
            const res = await fetch('/api/settings/data');
            const data = await res.json();
            
            document.getElementById('face_auth').checked = data.face_auth_enabled;
            document.getElementById('camera_flipped').checked = data.camera_flipped;
            
            // Trigger dot animation on load
            document.querySelectorAll('.toggle-checkbox').forEach(cb => {
                if(cb.checked) cb.parentElement.querySelector('.toggle-dot').style.transform = 'translateX(24px)';
            });

            const grid = document.getElementById('permissions_grid');
            grid.innerHTML = '';
            const perms = data.tool_permissions;
            for(const [key, val] of Object.entries(perms)) {
                const formattedKey = key.replace(/_/g, ' ');
                grid.innerHTML += `
                    <div class="flex items-center justify-between bg-black/30 p-3 rounded-lg border border-white/5">
                        <span class="text-sm capitalize">${formattedKey}</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only toggle-checkbox perm-check" data-key="${key}" ${val ? 'checked' : ''}>
                            <div class="w-10 h-5 toggle-bg rounded-full transition-all"></div>
                            <span class="absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition-transform toggle-dot"></span>
                        </label>
                    </div>
                `;
            }
            // Re-bind dots for dynamically added elements
            document.querySelectorAll('.perm-check').forEach(cb => {
                cb.addEventListener('change', () => {
                    const dot = cb.parentElement.querySelector('.toggle-dot');
                    if(cb.checked) dot.style.transform = 'translateX(20px)';
                    else dot.style.transform = 'translateX(0)';
                });
                if(cb.checked) cb.parentElement.querySelector('.toggle-dot').style.transform = 'translateX(20px)';
            });
        }

        // Save settings
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const perms = {};
            document.querySelectorAll('.perm-check').forEach(cb => {
                perms[cb.dataset.key] = cb.checked;
            });

            const payload = {
                face_auth_enabled: document.getElementById('face_auth').checked,
                camera_flipped: document.getElementById('camera_flipped').checked,
                tool_permissions: perms
            };

            const res = await fetch('/api/settings/data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            const msg = document.getElementById('status_msg');
            if(res.ok) {
                msg.textContent = "Settings saved successfully!";
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            }
        });

        loadSettings();
    </script>
</body>
</html>
